<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Inkwell Preview</title>
    <link rel="stylesheet" href="waypoint.css">
    <link rel="stylesheet" href="style.css">
    <script src="theme-files.js"></script>
    <script src="theme.js"></script>
    <script src="drafts.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="masthead">
      <div class="wordmark">inkwell<span>.</span></div>
      <div class="edition">DESKTOP PREVIEW <b> / </b> NO MAIL SYNC</div>
      <div class="theme-actions"><button id="new-draft" class="primary" type="button">Compose</button><button id="refresh" type="button">Refresh</button></div>
    </header>
    <main>
      <aside aria-label="Workspace navigation">
        <div class="section-label">WORKSPACE</div>
        <nav id="sections" aria-label="Workspace sections">
          <button data-view="mail" type="button" aria-pressed="true">Mail</button>
          <button data-view="calendar" type="button" aria-pressed="false">Calendar</button>
          <button data-view="contacts" type="button" aria-pressed="false">Contacts</button>
          <button data-view="theme" type="button" aria-pressed="false">Theme Studio</button>
        </nav>
        <nav id="folders" aria-label="Mail folders"></nav>
      </aside>
      <section id="index" aria-labelledby="title">
        <div class="view-header">
          <h1 id="title">Inbox</h1>
          <form id="search-form" role="search">
            <input type="search" id="search" aria-label="Search mail" placeholder="Search mail or tag:work" maxlength="200">
            <select id="search-scope" aria-label="Search scope"><option value="folder">This folder</option><option value="subfolders">Include subfolders</option><option value="all">All mail</option></select>
            <button type="submit">Search</button>
          </form>
        </div>
        <p id="status" role="status"></p>
        <div id="rows"></div>
        <div id="pages" hidden>
          <button id="previous" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </section>
      <section id="reader" aria-label="Message reader"><p class="placeholder">Select a message to read it here.</p></section>
    </main>
    <dialog id="draft-dialog" aria-labelledby="draft-title">
      <form id="draft-form">
        <h2 id="draft-title">Compose a draft</h2>
        <p>Plain text. Saved to your local Drafts folder; sending is not enabled in this preview.</p>
        <label>To<input name="recipient" maxlength="8192" autocomplete="off"></label>
        <label>Cc<input name="cc" maxlength="8192" autocomplete="off"></label>
        <label>Bcc<input name="bcc" maxlength="8192" autocomplete="off"></label>
        <label>Subject<input name="subject" maxlength="998" autocomplete="off"></label>
        <label>Message<textarea name="body" maxlength="500000" rows="10"></textarea></label>
        <p id="draft-status" role="status"></p>
        <div class="theme-actions"><button type="submit" class="primary">Save draft</button><button type="button" id="close-draft">Close</button></div>
      </form>
    </dialog>
    <dialog id="contact-dialog" aria-labelledby="contact-title">
      <form id="contact-form">
        <h2 id="contact-title">Contact</h2>
        <label>Name<input name="name" required maxlength="200" autocomplete="off"></label>
        <label>Email<input name="email" type="email" required maxlength="254" autocomplete="off"></label>
        <label>Company<input name="company" maxlength="200" autocomplete="off"></label>
        <label>Notes<textarea name="notes" maxlength="10000" rows="4"></textarea></label>
        <p id="contact-status" role="status"></p>
        <div class="theme-actions"><button type="submit" class="primary">Save contact</button><button type="button" id="cancel-contact">Cancel</button></div>
      </form>
    </dialog>
  </body>
</html>
