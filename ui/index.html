<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>inkwell&reg;</title>
    <link rel="stylesheet" href="waypoint.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="calendar-workspace.css">
    <script src="theme-files.js"></script>
    <script src="theme.js"></script>
    <script src="drafts.js" defer></script>
    <script src="calendar.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="brand-cell">
      <div class="wordmark"><span class="wordmark-name" data-text="inkwell">inkwell</span><span class="wordmark-mark">&reg;</span></div>
    </div>
    <header class="masthead">
      <button id="toggle-sidebar" type="button" aria-controls="workspace-sidebar" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">&#9776;</button>
      <form id="search-form" role="search">
        <input type="search" id="search" aria-label="Search workspace" placeholder="Search workspace" maxlength="200">
        <select id="search-scope" aria-label="Search scope"><option value="workspace">Workspace</option><option value="all">All mail</option><option value="folder">This folder</option><option value="subfolders">Include subfolders</option></select>
        <button type="submit">Search</button>
      </form>
      <form id="mail-filters" aria-label="Mail filters" class="mail-filters">
        <label class="filter-toggle"><input name="unread" type="checkbox"> Unread</label>
        <label class="filter-toggle"><input name="starred" type="checkbox"> Starred</label>
        <label>From <input name="from" type="date" aria-label="Mail from date"></label>
        <label>To <input name="to" type="date" aria-label="Mail to date"></label>
        <select name="order" aria-label="Mail order"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select>
        <button type="reset">Clear</button>
      </form>
      <div class="theme-actions"><button id="new-draft" class="primary" type="button">Compose</button><button id="sync-inbox" type="button" title="Import Outlook Inbox mail that is not already cached">Sync Outlook Inbox</button><button id="refresh" type="button" title="Reload local workspace data">Refresh</button></div>
    </header>
    <aside id="workspace-sidebar" aria-label="Workspace navigation">
        <div class="section-label">WORKSPACE</div>
        <nav id="sections" aria-label="Workspace sections">
          <button data-view="mail" type="button" aria-pressed="true">Mail</button>
          <button data-view="calendar" type="button" aria-pressed="false">Calendar</button>
          <button data-view="contacts" type="button" aria-pressed="false">Contacts</button>
          <button data-view="theme" type="button" aria-pressed="false">Theme Studio</button>
        </nav>
        <nav id="folders" aria-label="Mail folders"></nav>
    </aside>
    <div id="sync-notice" class="notification-bar" hidden>
      <span id="sync-status" role="status"></span>
      <button id="dismiss-sync" type="button" aria-label="Dismiss notification" title="Dismiss notification">&times;</button>
    </div>
    <main>
      <section id="index" aria-labelledby="title">
        <div class="view-header"><h1 id="title">Inbox</h1></div>
        <p id="status" role="status"></p>
        <div id="rows"></div>
        <div id="pages" hidden>
          <button id="previous" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
      </section>
      <section id="reader" aria-label="Message reader"><p class="placeholder">Select a message to read it here.</p></section>
    </main>
    <dialog id="event-dialog" aria-labelledby="event-title">
      <form id="event-form">
        <h2 id="event-title">New event</h2>
        <label>Title<input name="title" required maxlength="200"></label>
        <label class="inline-check"><input type="checkbox" name="all_day"> All day</label>
        <label>Starts<input name="start" type="datetime-local" required></label>
        <label>Ends (exclusive for all-day events)<input name="end" type="datetime-local" required></label>
        <label>Location<input name="location" maxlength="500"></label>
        <label>Notes<textarea name="notes" rows="4" maxlength="10000"></textarea></label>
        <p id="event-status" role="status"></p>
        <div class="theme-actions"><button type="submit" class="primary">Save event</button><button type="button" id="cancel-event">Cancel</button><button type="button" id="delete-event" hidden>Delete event</button></div>
      </form>
    </dialog>
    <dialog id="draft-dialog" aria-labelledby="draft-title">
      <form id="draft-form">
        <h2 id="draft-title">Compose a draft</h2>
        <p>Plain text. Saved to your local Drafts folder; sending is not enabled in this preview.</p>
        <label>To<input name="recipient" maxlength="8192" autocomplete="off" list="draft-to-addresses"></label>
        <label>Cc<input name="cc" maxlength="8192" autocomplete="off" list="draft-cc-addresses"></label>
        <label>Bcc<input name="bcc" maxlength="8192" autocomplete="off" list="draft-bcc-addresses"></label>
        <datalist id="draft-to-addresses"></datalist><datalist id="draft-cc-addresses"></datalist><datalist id="draft-bcc-addresses"></datalist>
        <label>Subject<input name="subject" maxlength="998" autocomplete="off"></label>
        <label>Message<textarea name="body" maxlength="500000" rows="10"></textarea></label>
        <p id="draft-status" role="status"></p>
        <div class="theme-actions"><button type="submit" class="primary">Save draft</button><button type="button" id="close-draft">Close</button><button type="button" id="delete-draft">Delete draft</button></div>
      </form>
    </dialog>
    <dialog id="contact-dialog" aria-labelledby="contact-title">
      <form id="contact-form">
        <h2 id="contact-title">Contact</h2>
        <label>Name<input name="name" required maxlength="200" autocomplete="off"></label>
        <label>Email<input name="email" type="email" required maxlength="254" autocomplete="off"></label>
        <label>Company<input name="company" maxlength="200" autocomplete="off"></label>
        <label>Notes<textarea name="notes" maxlength="10000" rows="4"></textarea></label>
        <p id="contact-status" role="status"></p>
        <div class="theme-actions"><button type="submit" class="primary">Save contact</button><button type="button" id="cancel-contact">Cancel</button></div>
      </form>
    </dialog>
  </body>
</html>
