[package]
name = "inkwell-tauri"
version = "0.2.0-alpha.1"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
dirs = "6"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.12", optional = true }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "inkwell-tauri"
path = "src/main.rs"
required-features = ["desktop"]
