[package]
name = "inkwell-tauri"
version = "0.2.0-alpha.11"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:arboard", "dep:serde_json", "dep:sha2", "dep:tempfile", "dep:reqwest"]

[dependencies]
arboard = { version = "3.7", optional = true, default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dirs = "6"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "form"], optional = true }
rusqlite = { version = "0.39", features = ["bundled", "functions"] }
unicode-normalization = "0.1.26"
unicode-casefold = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
tauri = { version = "2.12", optional = true }
tauri-plugin-dialog = { version = "2.8.3", optional = true }

[build-dependencies]
tauri-build = { version = "2.7", optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "inkwell-tauri"
path = "src/main.rs"
required-features = ["desktop"]
