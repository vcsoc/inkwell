[project]
name = "inkwell-mail"
version = "0.1.0"
description = "A local-first email, calendar and contacts workspace"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "cryptography>=44",
    "httpx>=0.28,<1",
    "nh3>=0.3,<0.4",
    "python-dateutil>=2.9,<3",
]

[dependency-groups]
build = [
    "pyinstaller>=6.15,<7",
]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 14
timeout_method = "thread"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
